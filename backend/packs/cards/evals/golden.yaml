    customer: C1004
    history: ["Why is my card statement higher this month?"]
    question: I want to dispute the QuickMart charge of ₹4,299
    action: cards_dispute_card_transaction
  - id: C08-loan-still-works
    customer: C1004
    question: What's my next loan EMI?
    contains: ["₹4,683"]
