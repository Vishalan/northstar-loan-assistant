[project]
name = "northstar-speech"
version = "0.1.0"
description = "Local speech recognition for the Northstar voice assistant (Parakeet on Apple Silicon via MLX)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "numpy>=1.26",
    "parakeet-mlx>=0.3",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speech"]

[tool.pytest.ini_options]
testpaths = ["tests"]
