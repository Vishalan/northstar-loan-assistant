[project]
name = "northstar-speech"
version = "0.1.0"
description = "Speech service for the Northstar voice assistant: swappable recognition and synthesis engines"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "numpy>=1.26",
    "httpx>=0.27",
    "parakeet-mlx>=0.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
cuda = ["faster-whisper>=1.1"]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speech"]

[tool.pytest.ini_options]
testpaths = ["tests"]
